[project]
name = "scalable-recommendation-api"
version = "1.0.0"
description = "Scalable Recommendation Microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "qdrant-client>=1.9.1",
    "openai>=1.35.3",
    "upstash-redis>=1.2.2",
    "python-json-logger>=2.0.7"
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "app/tests",
]
pythonpath = [
    "."
]
